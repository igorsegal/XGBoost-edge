name: AHexaTrader MQL5 Edge Miner

on:
  schedule:
    - cron: '0 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mine-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python src/main.py

      - name: Commit updated state
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen_urls and backfill cursor" && git pull --rebase && git push)
